# Team configuration — defaults + standard version
# This file is the TEAM STANDARD. Projects override via their own project.yaml
# (see project.example.yaml). Never edit this file to fit one project.

standard_version: "1.0.0"
# SemVer of THIS standard. Adapters and projects pin against it.
# Breaking changes -> MAJOR bump + migration note in CHANGELOG.md.

team:
  name: "Example Engineering Team"
  contact: "team-lead@example.com"
  timezone: "Asia/Ho_Chi_Minh"   # used to interpret due dates / planner events
  language: "en"                 # primary language for artifacts

defaults:
  workflow: "workflows/feature-development.md"
  requirement_template: "templates/requirement.md"
  design_template: "templates/technical-design.md"
  task_template: "templates/task-breakdown.md"
  test_plan_template: "templates/test-plan.md"
  review_template: "templates/code-review.md"
  # Knowledge index for future RAG/MCP use (optional, file-based by default)
  knowledge_index: "knowledge/index.yaml"

# Which core artifacts every adapter must expose (validated by scripts/validate.*).
required_core:
  - "standards/coding.md"
  - "standards/architecture.md"
  - "standards/security.md"
  - "standards/testing.md"
  - "standards/git.md"
  - "standards/ai-usage.md"
  - "roles/ba.md"
  - "roles/architect.md"
  - "roles/developer.md"
  - "roles/qa.md"
  - "roles/reviewer.md"
  - "roles/devops.md"

# Tool allowlist is informational only — any tool may add an adapter
# as long as it references core artifacts instead of duplicating them.
allowed_tools: ["opencode", "claude", "cursor", "copilot", "codex"]
