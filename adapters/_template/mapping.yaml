# mapping.yaml template — lists core artifacts exposed via the tool's native mechanism.
tool: "<name>"
standard_version: "1.0.0"   # must satisfy team.yaml compatible range
native_files:
  - generated_path: "<e.g. AGENTS.md>"
    source_refs:
      - "standards/ai-usage.md"
      - "standards/coding.md"
      - "roles/developer.md"
notes: "No rule text duplicated — generated file contains pointers + installer copies."
