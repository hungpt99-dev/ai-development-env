tool: "opencode"
standard_version: "1.0.0"
native_files:
  - generated_path: "AGENTS.md"
    mechanism: "opencode instructions file at repo root"
    source_refs:
      - "standards/ai-usage.md"
      - "standards/coding.md"
      - "standards/security.md"
      - "standards/testing.md"
      - "roles/developer.md"
  - generated_path: "opencode.json"
    mechanism: "custom commands pointing at prompts/"
    source_refs:
      - "prompts/analyze.md"
      - "prompts/plan.md"
      - "prompts/implement.md"
      - "prompts/review.md"
      - "prompts/debug.md"
