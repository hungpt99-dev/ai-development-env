tool: "copilot"
standard_version: "1.0.0"
native_files:
  - generated_path: ".github/muse-instructions.md"
    mechanism: "copilot repo instructions"
    source_refs:
      - "standards/ai-usage.md"
      - "standards/coding.md"
      - "standards/testing.md"
  - generated_path: ".github/prompts/implement.prompt.md"
    mechanism: "copilot prompt -> prompts/implement.md"
    source_refs:
      - "prompts/implement.md"
  - generated_path: ".github/prompts/review.prompt.md"
    mechanism: "copilot prompt -> prompts/review.md"
    source_refs:
      - "prompts/review.md"
